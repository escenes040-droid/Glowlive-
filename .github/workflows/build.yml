
name: Build GlowLive APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: unzip -q GlowLiveAndroid_with_APK_build.zip -d GlowLiveAndroid

      - name: Build APK
        run: gradle -p GlowLiveAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GlowLive-debug-apk
          path: GlowLiveAndroid/app/build/outputs/apk/debug/app-debug.apk
